name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project and module contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Validate continuity documents
        run: python3 scripts/validate_project_docs.py

      - name: Validate WebView security contract
        run: python3 scripts/validate_webview_security.py

      - name: Run module package contract tests
        run: python3 -m unittest discover -s tests -v
